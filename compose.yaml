# Klistra in i en ny stack i Dockge (namn: bifrost).
# Ändra sökvägen till din dataset och fyll i GITHUB_TOKEN under ".env" i Dockge.
services:
  bifrost:
    image: ghcr.io/nullpointernecromancer/bifrost:latest
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      # Adressen familjens enheter når butiken på. Hemma + VPN = serverns LAN-adress.
      BIFROST_URL: http://192.168.1.51:8095
      # GitHub-repon vars releaser ska in i butiken, separerade med mellanslag
      # ägare/repo eller ägare/repo:mönster, mellanslag emellan.
      # Citattecknen behövs – annars tolkar YAML * som en specialtecken.
      BIFROST_REPOS: "NullPointerNecromancer/shieldknapp edde746/plezy:*arm64-v8a* leanbitlab-org/LtvLauncher:*arm64-v8a* meddouribadis/arclauncher:*arm64-v8a*"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SYNC_INTERVAL_MIN: 15
      KEEP_RELEASES: 3
      TZ: Europe/Stockholm
    volumes:
      # Här ligger butikens signeringsnyckel – ta backup på den!
      - /mnt/Rodin-27TB-Z2/docker/bifrost/data:/data
